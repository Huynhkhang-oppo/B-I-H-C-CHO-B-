<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350f" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Inner circle -->
  <circle cx="256" cy="256" r="180" fill="url(#inner)" filter="url(#shadow)"/>

  <!-- Lion face -->
  <!-- Mane circles -->
  <g fill="#f59e0b">
    <circle cx="160" cy="170" r="40"/>
    <circle cx="256" cy="140" r="45"/>
    <circle cx="352" cy="170" r="40"/>
    <circle cx="130" cy="256" r="42"/>
    <circle cx="382" cy="256" r="42"/>
    <circle cx="160" cy="340" r="40"/>
    <circle cx="352" cy="340" r="40"/>
    <circle cx="256" cy="370" r="40"/>
  </g>

  <!-- Face base -->
  <circle cx="256" cy="260" r="110" fill="#fde68a"/>

  <!-- Ears -->
  <circle cx="180" cy="180" r="28" fill="#f59e0b"/>
  <circle cx="180" cy="180" r="16" fill="#fbcfe8"/>
  <circle cx="332" cy="180" r="28" fill="#f59e0b"/>
  <circle cx="332" cy="180" r="16" fill="#fbcfe8"/>

  <!-- Eyes -->
  <ellipse cx="215" cy="245" rx="14" ry="18" fill="#1e293b"/>
  <circle cx="219" cy="240" r="6" fill="#ffffff"/>
  <ellipse cx="297" cy="245" rx="14" ry="18" fill="#1e293b"/>
  <circle cx="301" cy="240" r="6" fill="#ffffff"/>

  <!-- Rosy Cheeks -->
  <circle cx="190" cy="280" r="16" fill="#fda4af" opacity="0.8"/>
  <circle cx="322" cy="280" r="16" fill="#fda4af" opacity="0.8"/>

  <!-- Nose -->
  <polygon points="256,265 242,282 270,282" fill="#78350f"/>

  <!-- Smile -->
  <path d="M 238 290 Q 256 310 274 290" fill="none" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>

  <!-- Golden Graduation / Wisdom Star on top -->
  <polygon points="256,70 268,98 298,100 274,118 282,146 256,130 230,146 238,118 214,100 244,98" fill="#fbbf24" stroke="#ffffff" stroke-width="4"/>
</svg>
